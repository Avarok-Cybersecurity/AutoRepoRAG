name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # The exact tagged tree must pass the mock e2e before anything is published.
  e2e-mock:
    name: E2E mock on tag (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action (mock)
        id: run
        uses: ./
        with:
          paths: |
            test/fixtures/**
          mock-embeddings: 'true'
          output-dir: release-out

      - name: Schema check
        env:
          CORPUS_FILE: ${{ steps.run.outputs.corpus-file }}
          CORPUS_GZ_FILE: ${{ steps.run.outputs.corpus-gz-file }}
          METADATA_FILE: ${{ steps.run.outputs.metadata-file }}
        run: node test/schema-check.mjs "$CORPUS_FILE" "$CORPUS_GZ_FILE" "$METADATA_FILE"

  release:
    name: Create GitHub Release
    needs: e2e-mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release notes = this version's section of CHANGELOG.md (Keep a
      # Changelog layout: "## [X.Y.Z] - date" ... up to the next "## [").
      - name: Extract changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no section for ${version}; using a pointer instead"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$TAG" > notes.md
          fi
          echo '--- release notes ---'
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "AutoRepoRAG $TAG" \
            --notes-file notes.md

      # Consumers pin `uses: Avarok-Cybersecurity/AutoRepoRAG@v1`; every
      # v1.x.y release moves that major tag to the released commit.
      - name: Move major tag v1
        if: startsWith(github.ref_name, 'v1.')
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 "$GITHUB_SHA"
          git push --force origin v1
