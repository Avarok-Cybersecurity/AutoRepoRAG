name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  # The LatticeDB release whose wasm pair ships in repo-chat-<tag>.tar.gz
  # (recorded in its repo-chat.manifest.json). Sites using the action pick
  # their own with the lattice-version input.
  RELEASE_LATTICE_VERSION: v0.3.3

jobs:
  # The exact tagged tree must pass the full CI (lint, unit tests, every e2e
  # job) before anything is published. Reusing ci.yml keeps one definition of
  # the inputs those runs state.
  ci:
    name: CI on tag
    uses: ./.github/workflows/ci.yml

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release notes = this version's section of CHANGELOG.md (Keep a
      # Changelog layout: "## [X.Y.Z] - date" ... up to the next "## [").
      - name: Extract changelog section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::warning::CHANGELOG.md has no section for ${version}; using a pointer instead"
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' \
              "$GITHUB_REPOSITORY" "$TAG" > notes.md
          fi
          echo '--- release notes ---'
          cat notes.md

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # repo-chat-<tag>.tar.gz: the committed library dist (CI on this tag
      # already proved it equals a fresh build), the sha256-verified wasm
      # pair, and the manifest, under one repo-chat-<tag>/ directory. The
      # archive is byte-reproducible (sorted, zero mtimes and owners).
      - name: Package the website-chat library
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          lib="$(node -p "require('./website-chat/package.json').version")"
          [ "v$lib" = "$TAG" ] || { echo "::error::website-chat/package.json is $lib, tag is $TAG"; exit 1; }
          stage="$RUNNER_TEMP/stage"
          node scripts/emit-website-chat.mjs "$RELEASE_LATTICE_VERSION" "$stage/repo-chat-$TAG" "$RUNNER_TEMP/lattice-wasm"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$stage" -cf - "repo-chat-$TAG" \
            | gzip -9n > "repo-chat-$TAG.tar.gz"
          sha256sum "repo-chat-$TAG.tar.gz" > "repo-chat-$TAG.tar.gz.sha256"
          cat "repo-chat-$TAG.tar.gz.sha256"
          tar -tzvf "repo-chat-$TAG.tar.gz"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --verify-tag \
            --title "AutoRepoRAG $TAG" \
            --notes-file notes.md \
            "repo-chat-$TAG.tar.gz" \
            "repo-chat-$TAG.tar.gz.sha256"

      # Consumers pin `uses: Avarok-Cybersecurity/AutoRepoRAG@v<major>`; a
      # release moves its major tag (v2.3.1 -> v2) to the released commit, but
      # only when it is the newest release of that major (a v2.0.5 patch cut
      # after v2.1.0 must not drag v2 backwards). 0.x has no moving tag.
      - name: Move major tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          if [ "$major" = v0 ]; then
            echo "pre-1.0 release: no moving major tag"
            exit 0
          fi
          newest="$(git ls-remote --tags --refs origin \
            | sed 's|.*refs/tags/||' | grep -E "^${major}\.[0-9]+\.[0-9]+\$" | sort -V | tail -n 1)"
          if [ "$newest" != "$TAG" ]; then
            echo "$TAG is not the newest ${major} release ($newest is); leaving ${major} alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/${major}"
