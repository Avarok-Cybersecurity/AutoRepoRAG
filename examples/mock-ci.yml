# examples/mock-ci.yml
#
# Pull-request dry run: proves the chunking + corpus pipeline still works on
# every PR without spending a single embedding request. Mock vectors are
# deterministic (sha256-seeded), so no secrets ever reach fork PRs.

name: Corpus dry run

on:
  pull_request:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build mock corpus
        id: rag
        uses: Avarok-Cybersecurity/AutoRepoRAG@v2
        with:
          paths: |
            src/**/*.rs
          mock-embeddings: 'true'
          mock-dim: '256'
          # Mock mode still states every corpus-shaping input: the dry run
          # must chunk exactly like the real publish does.
          embedding-endpoint: https://openrouter.ai/api/v1
          collection: coderag
          chunk-lines: '90'
          chunk-overlap: '15'
          max-chunk-bytes: '16384'
          vector-precision: '6'
          request-interval-ms: '2500'
          lattice-version: v0.3.3
          generate-website-chat: 'false'

      - name: Report
        env:
          POINTS: ${{ steps.rag.outputs.points }}
          DIM: ${{ steps.rag.outputs.dim }}
          SHA256: ${{ steps.rag.outputs.sha256 }}
        run: |
          set -euo pipefail
          [ "$POINTS" -gt 0 ]
          echo "corpus OK: $POINTS points, dim $DIM, sha256 $SHA256"
