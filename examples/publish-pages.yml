# examples/publish-pages.yml
#
# Full production pattern (this is how Atlas publishes its corpus):
# merge to main -> embed only what changed (incremental reuse against the
# previously published corpus) -> keep a CI copy as an artifact -> publish the
# gzip corpus + metadata to an orphan gh-pages branch.
#
# GitHub Pages serves with `Access-Control-Allow-Origin: *` and no TTL, so the
# published URL is directly fetchable from any browser app. One-time setup:
# repo Settings -> Pages -> "Deploy from a branch" -> gh-pages / root.

name: Publish code corpus

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

# Never let two corpus publishes race the gh-pages force-push.
concurrency:
  group: coderag-publish
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build corpus (incremental against the published one)
        id: rag
        uses: Avarok-Cybersecurity/AutoRepoRAG@v2
        with:
          paths: |
            crates/**/*.rs
            crates/**/*.cu
            kernels/**/*.cu
            kernels/**/*.cuh
          output-name: coderag
          embedding-endpoint: https://openrouter.ai/api/v1
          embedding-model: nvidia/llama-nemotron-embed-vl-1b-v2:free
          embedding-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          collection: coderag
          chunk-lines: '90'
          chunk-overlap: '15'
          max-chunk-bytes: '16384'
          vector-precision: '6'
          request-interval-ms: '2500'
          lattice-version: v0.3.3
          generate-website-chat: 'false'
          # First run 404s here -> the action warns and does a full embed.
          # Every later run only embeds chunks whose content changed.
          previous-corpus-url: https://OWNER.github.io/REPO/coderag/coderag.jsonl.gz
          previous-corpus-meta-url: https://OWNER.github.io/REPO/coderag/coderag.meta.json

      - name: Upload CI copy (30-day artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coderag-corpus
          path: |
            ${{ steps.rag.outputs.corpus-gz-file }}
            ${{ steps.rag.outputs.metadata-file }}
          retention-days: 30

      # Orphan single-commit branch: gh-pages history never grows, and the
      # corpus URL is stable forever:
      #   https://OWNER.github.io/REPO/coderag/coderag.jsonl.gz
      #   https://OWNER.github.io/REPO/coderag/coderag.meta.json
      - name: Publish to orphan gh-pages
        env:
          CORPUS_GZ: ${{ steps.rag.outputs.corpus-gz-file }}
          META: ${{ steps.rag.outputs.metadata-file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          site="$(mktemp -d)"
          mkdir -p "$site/coderag"
          cp "$CORPUS_GZ" "$site/coderag/coderag.jsonl.gz"
          cp "$META" "$site/coderag/coderag.meta.json"
          touch "$site/.nojekyll"
          cd "$site"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "coderag corpus @ ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
