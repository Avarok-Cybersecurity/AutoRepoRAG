name: AutoRepoRAG
description: >-
  Build a self-verifying LatticeDB vector corpus (lattice-jsonl) from your
  repository: chunk source files, embed them (live OpenRouter-compatible
  endpoint or deterministic mock), load and verify against a real
  lattice-server, and export corpus + gzip + metadata for publishing.
author: Avarok Cybersecurity

branding:
  icon: database
  color: purple

# Inputs that shape the corpus (endpoint, chunking, precision, server
# version, collection, pacing) are required with no default: two corpora are
# only comparable when every one of them was stated. "required" is enforced by
# src/inputs.mjs, which fails naming the input (GitHub does not enforce it for
# composite actions). Plumbing inputs keep their defaults here, the only place
# they are defined.
inputs:
  paths:
    description: Newline-separated include globs (** / * / ? and {a,b}), relative to the source root (source-dir, or the workspace).
    required: true
  exclude:
    description: Newline-separated exclude globs applied after `paths`.
    required: false
    default: ''
  source-dir:
    description: >-
      Workspace-relative directory holding an external git checkout to chunk
      instead of the workspace (e.g. a repo checked out by actions/checkout at
      a pinned SHA). Its repo and commit are derived from the checkout itself;
      it must be the root of a git checkout with a remote.origin.url. Empty =
      the workspace, with GITHUB_REPOSITORY / GITHUB_SHA as in v1.
    required: false
    default: ''
  collection:
    description: LatticeDB collection name recorded in the corpus header.
    required: true
  output-dir:
    description: Directory (relative to the workspace) where corpus, gzip and metadata are written.
    required: false
    default: autoreporag-out
  output-name:
    description: Basename for outputs (<name>.jsonl, <name>.jsonl.gz, <name>.meta.json).
    required: false
    default: coderag
  gzip:
    description: Also write a gzip -9 twin of the corpus.
    required: false
    default: 'true'
  embedding-endpoint:
    description: >-
      OpenAI-compatible embeddings API base URL (POST <endpoint>/embeddings):
      OpenRouter, Cloudflare Workers AI
      (https://api.cloudflare.com/client/v4/accounts/<id>/ai/v1) or any
      other. Required in mock mode too, except that a v3 search-mode
      "lexical" run embeds nothing and refuses it.
    required: false
    default: ''
  embedding-model:
    description: Embedding model id. Required unless mock-embeddings is true.
    required: false
    default: ''
  embedding-api-key:
    description: API key for the embedding endpoint. Masked immediately; required unless mock-embeddings is true.
    required: false
    default: ''
  mock-embeddings:
    description: Use deterministic sha256-seeded L2-normalized mock vectors (CI needs no secrets).
    required: false
    default: 'false'
  mock-dim:
    description: Vector dimensionality in mock mode.
    required: false
    default: '256'
  chunk-lines:
    description: Lines per chunk window. Required for chunk-strategy "lines" (and every v2 run); refused for "markdown".
    required: false
    default: ''
  chunk-overlap:
    description: >-
      Lines of overlap between consecutive chunks (stride = chunk-lines -
      chunk-overlap). Required exactly when chunk-lines is.
    required: false
    default: ''
  max-chunk-bytes:
    description: Hard byte cap per chunk text (UTF-8).
    required: true
  batch-size:
    description: Texts per embeddings request.
    required: false
    default: '32'
  request-interval-ms:
    description: Minimum milliseconds between embeddings request starts (free-tier pacing). Refused when search-mode is "lexical", required otherwise.
    required: false
    default: ''
  max-retries:
    description: Attempts per embeddings request (700ms * 2^n backoff on transient failures).
    required: false
    default: '3'
  max-chunks:
    description: Upper bound on chunks (0 = unlimited); truncates with a warning.
    required: false
    default: '0'
  vector-precision:
    description: Significant digits vectors are rounded to (then f32-cast) before upsert and export. Refused when search-mode is "lexical", required otherwise.
    required: false
    default: ''
  previous-corpus-url:
    description: >-
      file:// or http(s):// URL of a previously published corpus (.jsonl or
      .jsonl.gz) for incremental reuse by chunk_hash. Requires
      previous-corpus-meta-url.
    required: false
    default: ''
  previous-corpus-meta-url:
    description: >-
      file:// or http(s):// URL of that corpus's .meta.json; it must declare
      the same model, and dims must match, else the cache is discarded with a
      warning. Required when previous-corpus-url is set, rejected otherwise.
    required: false
    default: ''
  lattice-version:
    description: Pinned lattice-db release tag whose lattice-server binary is downloaded and sha256-verified (e.g. v0.3.3).
    required: true
  lattice-port:
    description: Loopback port for the throwaway lattice-server.
    required: false
    default: '6334'
  generate-website-chat:
    description: >-
      'true' or 'false'. 'true' emits the "Talk to the Repo" website-chat
      library into <output-dir>/<website-chat-dir>: repo-chat.js,
      repo-chat.css, the LatticeDB wasm pair of lattice-version (downloaded
      from that release and sha256-verified) and repo-chat.manifest.json.
    required: true
  website-chat-dir:
    description: >-
      Directory for the website-chat library, relative to output-dir (it may
      not be absolute, climb out of output-dir, or be output-dir itself).
      Required when generate-website-chat is 'true', rejected otherwise.
    required: false
    default: ''

  # --- v3: site corpora. Any one of these set turns v3 mode on; v3 mode
  # --- then requires chunk-strategy, search-mode and snapshot (src/inputs-v3.mjs).
  files-dir:
    description: >-
      Workspace-relative directory of plain files to chunk instead of a git
      checkout (e.g. a site's built, gitignored dist/). Never consults git:
      paths/exclude globs apply relative to it. Requires corpus-repo and
      corpus-commit; exclusive with source-dir.
    required: false
    default: ''
  corpus-repo:
    description: '"owner/name" stamped on every chunk in files-dir mode (required there, refused otherwise).'
    required: false
    default: ''
  corpus-commit:
    description: Full 40- or 64-hex commit id stamped on every chunk in files-dir mode (required there, refused otherwise).
    required: false
    default: ''
  chunk-strategy:
    description: >-
      "lines" (v2 line windows: needs chunk-lines/chunk-overlap) or
      "markdown" (split at headings, heading_path per chunk, long sections
      split between paragraphs, never inside fenced code or tables; adds a
      "next" edge between consecutive chunks of a file). Required in v3 mode.
    required: false
    default: ''
  payload-sidecar:
    description: >-
      Path (absolute, or relative to the workspace) of a JSON object mapping a
      chunked file's path to extra payload fields, e.g.
      {"about/index.md": {"url": "...", "title": "...", "lastmod": "..."}}.
      A path not in the corpus, or a field the action writes, is an error.
    required: false
    default: ''
  edges-file:
    description: >-
      Path (absolute, or relative to the workspace) of a JSON array of
      {"from": {"path", "chunk"?}, "to": {"path", "chunk"?}, "relation",
      "weight"} edges (chunk = 0-based index within the file, default 0),
      written as lattice-jsonl edge lines and added to the snapshot.
    required: false
    default: ''
  search-mode:
    description: >-
      "lexical" (BM25 text index, no vectors, no embedding calls),
      "vector" (dense vectors only) or "hybrid" (both). Required in v3 mode.
    required: false
    default: ''
  vector-index:
    description: '"hnsw" or "flat" (exact scan). Required when search-mode is "vector" or "hybrid", refused otherwise.'
    required: false
    default: ''
  vector-storage:
    description: '"f32", "f16" or "int8" stored vector precision. Required when search-mode is "vector" or "hybrid", refused otherwise.'
    required: false
    default: ''
  snapshot:
    description: >-
      'true' or 'false'. 'true' exports the loaded collection as a LatticeDB
      snapshot (format 2: HNSW graph + BM25 postings, <output-name>.lattice).
      Required in v3 mode.
    required: false
    default: ''
  max-snapshot-bytes:
    description: >-
      Fail when the snapshot is larger (e.g. 26214400, Cloudflare's 25 MiB
      per-asset limit). Required when snapshot is 'true', refused otherwise.
    required: false
    default: ''

outputs:
  corpus-file:
    description: Absolute path of the written lattice-jsonl corpus.
    value: ${{ steps.build.outputs.corpus-file }}
  corpus-gz-file:
    description: Absolute path of the gzip twin (empty when gzip is false).
    value: ${{ steps.build.outputs.corpus-gz-file }}
  metadata-file:
    description: Absolute path of the metadata JSON.
    value: ${{ steps.build.outputs.metadata-file }}
  dim:
    description: Vector dimensionality of the corpus.
    value: ${{ steps.build.outputs.dim }}
  points:
    description: Number of points in the corpus.
    value: ${{ steps.build.outputs.points }}
  embedded:
    description: Chunks embedded fresh this run.
    value: ${{ steps.build.outputs.embedded }}
  reused:
    description: Chunks whose vectors were reused from previous-corpus-url.
    value: ${{ steps.build.outputs.reused }}
  sha256:
    description: sha256 of the raw corpus file.
    value: ${{ steps.build.outputs.sha256 }}
  website-chat-dir:
    description: Absolute path of the emitted website-chat bundle (empty when generate-website-chat is 'false').
    value: ${{ steps.build.outputs.website-chat-dir }}
  snapshot-file:
    description: Absolute path of the LatticeDB snapshot (empty unless snapshot is 'true').
    value: ${{ steps.build.outputs.snapshot-file }}
  edges:
    description: Number of edges in the corpus (always 0 in v2 mode).
    value: ${{ steps.build.outputs.edges }}

runs:
  using: composite
  steps:
    - name: Build corpus
      id: build
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_SOURCE_DIR: ${{ inputs.source-dir }}
        INPUT_COLLECTION: ${{ inputs.collection }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_OUTPUT_NAME: ${{ inputs.output-name }}
        INPUT_GZIP: ${{ inputs.gzip }}
        INPUT_EMBEDDING_ENDPOINT: ${{ inputs.embedding-endpoint }}
        INPUT_EMBEDDING_MODEL: ${{ inputs.embedding-model }}
        INPUT_EMBEDDING_API_KEY: ${{ inputs.embedding-api-key }}
        INPUT_MOCK_EMBEDDINGS: ${{ inputs.mock-embeddings }}
        INPUT_MOCK_DIM: ${{ inputs.mock-dim }}
        INPUT_CHUNK_LINES: ${{ inputs.chunk-lines }}
        INPUT_CHUNK_OVERLAP: ${{ inputs.chunk-overlap }}
        INPUT_MAX_CHUNK_BYTES: ${{ inputs.max-chunk-bytes }}
        INPUT_BATCH_SIZE: ${{ inputs.batch-size }}
        INPUT_REQUEST_INTERVAL_MS: ${{ inputs.request-interval-ms }}
        INPUT_MAX_RETRIES: ${{ inputs.max-retries }}
        INPUT_MAX_CHUNKS: ${{ inputs.max-chunks }}
        INPUT_VECTOR_PRECISION: ${{ inputs.vector-precision }}
        INPUT_PREVIOUS_CORPUS_URL: ${{ inputs.previous-corpus-url }}
        INPUT_PREVIOUS_CORPUS_META_URL: ${{ inputs.previous-corpus-meta-url }}
        INPUT_LATTICE_VERSION: ${{ inputs.lattice-version }}
        INPUT_LATTICE_PORT: ${{ inputs.lattice-port }}
        INPUT_GENERATE_WEBSITE_CHAT: ${{ inputs.generate-website-chat }}
        INPUT_WEBSITE_CHAT_DIR: ${{ inputs.website-chat-dir }}
        INPUT_FILES_DIR: ${{ inputs.files-dir }}
        INPUT_CORPUS_REPO: ${{ inputs.corpus-repo }}
        INPUT_CORPUS_COMMIT: ${{ inputs.corpus-commit }}
        INPUT_CHUNK_STRATEGY: ${{ inputs.chunk-strategy }}
        INPUT_PAYLOAD_SIDECAR: ${{ inputs.payload-sidecar }}
        INPUT_EDGES_FILE: ${{ inputs.edges-file }}
        INPUT_SEARCH_MODE: ${{ inputs.search-mode }}
        INPUT_VECTOR_INDEX: ${{ inputs.vector-index }}
        INPUT_VECTOR_STORAGE: ${{ inputs.vector-storage }}
        INPUT_SNAPSHOT: ${{ inputs.snapshot }}
        INPUT_MAX_SNAPSHOT_BYTES: ${{ inputs.max-snapshot-bytes }}
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"

    - name: Stop lattice-server
      if: always()
      shell: bash
      run: |
        pidfile="${RUNNER_TEMP:-${GITHUB_WORKSPACE:-$PWD}/.work}/autoreporag-lattice.pid"
        if [ -f "$pidfile" ]; then
          pid="$(cat "$pidfile")"
          if kill -0 "$pid" 2>/dev/null; then
            kill -TERM "$pid" 2>/dev/null || true
            for _ in $(seq 1 30); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 0.1
            done
            kill -KILL "$pid" 2>/dev/null || true
          fi
          rm -f "$pidfile"
        fi
